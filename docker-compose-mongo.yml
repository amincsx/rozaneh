version: '3.8'
services:
  mongodb:
    image: mongo:5.0
    container_name: rozaneh-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: app2
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - rozaneh-network

volumes:
  mongodb_data:


networks:
  rozaneh-network:
    driver: bridge
